[project]
name = "aether"
version = "0.1.0"
description = "A small checkable language for business procedures, a benchmark, and a checker."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lark>=1.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
]

# Optional: web demo (uv run --group demo python demo/app.py)
demo = [
    "gradio>=5",
]
# Optional: running and fine-tuning local open models (uv sync --group ml)
ml = [
    "torch>=2.5",
    "transformers>=4.45",
    "accelerate>=1.0",
    "peft>=0.13",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["checker", "interpreter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
